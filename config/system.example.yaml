schedule:
  timezone: America/New_York
  daily_at: "09:00"
  full_reconciliation: weekly
  entity_audit: monthly
resources:
  max_concurrent_sources: 2
  max_concurrent_browser_tasks: 1
  max_llm_calls_per_cycle: 50
  min_free_disk_gb: 10
runtime:
  desired_state: STOPPED
network:
  bind_host: 127.0.0.1
  private_network_only: true
automation:
  outbound_requires_human: true
  final_submit_requires_human: true
